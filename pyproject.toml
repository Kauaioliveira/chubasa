[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chubasa"
version = "0.1.0"
description = "Assistente de voz que acorda com a palavra-chave e responde em voz."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic-settings>=2.6",
    "sounddevice>=0.5",
    # No Linux o openWakeWord 0.6 exige tflite-runtime, que não existe para Python 3.12.
    # Só usamos ONNX: lá ele é instalado com --no-deps (veja o README) e as dependências
    # que ele realmente usa vêm declaradas abaixo.
    "openwakeword>=0.6,<0.7; platform_system != 'Linux'",
    "onnxruntime>=1.16",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "requests>=2.31",
    "faster-whisper>=1.1,<2",
    "claude-agent-sdk>=0.2,<0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Verificação de voz (SpeechBrain ECAPA em CPU). No Windows o torch do PyPI já é só CPU;
# no Linux use --extra-index-url https://download.pytorch.org/whl/cpu para não baixar o CUDA.
voz = [
    "speechbrain>=1.0,<2",
    "torch>=2.1",
    "torchaudio>=2.1",
]

[tool.setuptools.packages.find]
include = ["chubasa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hardware and not modelos'"
markers = [
    "hardware: precisa de microfone/alto-falante de verdade (rode com: pytest -m hardware)",
    "modelos: baixa ou carrega modelos reais (rode com: pytest -m modelos)",
]
